[package]
name = "hgs"
version = "1.58.0"
edition = "2021"
rust-version = "1.99"
description = "Persistent local and remote agent sessions for Zerus"
license = "MIT"
repository = "https://github.com/ufna/zerus"

[[bin]]
name = "hgs"
path = "src/main.rs"

[features]
# WhiteWh fork: optional extensions (src/extensions.rs), off by default.
socraticode = []

# Fresh, single-threaded private kernel owners; no installed command entry.
[[test]]
name = "linux-custody"
path = "tests/linux_custody.rs"
harness = false

[dependencies]
canonicalpath-rust = { git = "https://github.com/romanilyin/canonicalpath", rev = "50b390675a146874b1555f361e491d1efeb393a7" }
anyhow = "1"
aes-gcm = "0.10.3"
base64 = "0.22"
ed25519-dalek = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = "0.10"
fs2 = "0.4"
hkdf = "0.12.4"
http = "1.3"
libc = "0.2"
p256 = { version = "0.13.2", features = ["ecdh", "pkcs8"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
regex = "1"
rusqlite = { version = "0.32", features = ["bundled", "hooks", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "raw_value"] }
sha2 = "0.10"
shell-words = "1"
tempfile = "3"
toml_edit = "0.25"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }
ruzstd = { version = "0.8", default-features = false }
ureq = { version = "3.4", default-features = false, features = ["rustls", "platform-verifier"] }
zerus-replica = { path = "crates/replica" }
zerus-mobile-task-edit = { path = "crates/mobile-task-edit" }
zerus-team-plan = { path = "crates/team-plan" }
zerus-file-lock = { path = "crates/file-lock" }
zerus-watch-protocol = { path = "crates/watch-protocol" }
zerus-desktop-migration = { path = "crates/desktop-migration" }
zerus-desktop-ledger = { path = "crates/desktop-ledger" }
zerus-desktop-catalog = { path = "crates/desktop-catalog" }
zerus-presence-sampler = { path = "crates/presence-sampler" }
zerus-content-search = { path = "crates/content-search" }
zerus-client-core = { path = "client/core", default-features = false }

[dev-dependencies]
zerus-file-lock = { path = "crates/file-lock", features = ["test-support"] }
# Documents an older replica leaves, for the task index's tests.
zerus-replica = { path = "crates/replica", features = ["test-support"] }

[target.'cfg(target_os = "linux")'.dependencies]
async-io = "2.6"
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }
zerus-freedesktop-notify = { path = "crates/freedesktop-notify" }

[target.'cfg(target_os = "macos")'.dependencies]
zerus-client-core = { path = "client/core", default-features = false, features = ["macos-native-peer"] }

[target.'cfg(windows)'.dependencies]
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
    "Data_Xml_Dom",
    "Foundation",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_TaskScheduler",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_UI_Notifications",
] }
windows-sys = { version = "0.61", features = [
    "Wdk_System_Threading",
    "Wdk_System_SystemServices",
    "Wdk_Storage_FileSystem",
    "Wdk_Foundation",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Registry",
    "Win32_System_StationsAndDesktops",
    "Win32_System_RestartManager",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock"] }

# Task #43 (team ede724c4): debug and test builds hash executables with an
# optimized sha2. Unoptimized, hashing the 167 MB test binary that the
# portable frontend tests bind ran past the record's 10 s deadline in a run
# from an agent session ("pinned executable read deadline"). Upstream: test
# builds also hash adoption bodies of up to 32 MiB many times.
[profile.dev.package.sha2]
opt-level = 3

[profile.release]
strip = true
lto = "thin"

[build-dependencies]
cc = "1"
