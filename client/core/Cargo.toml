[package]
name = "zerus-client-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "MIT"
description = "Watch streams, catalog state and per-frame batches of the Zerus desktop client"
publish = false

# Pure Rust and fast to test: no Tauri or async runtime by default. The Tauri app in
# client/src-tauri depends on this crate by path.
[dependencies]
zerus-desktop-read-policy = { path = "../../crates/desktop-read-policy" }
base64 = "0.22"
infer = { version = "0.22", default-features = false, features = ["alloc"] }
# Reading Qt's macOS preference plist once, at the switch (settings).
plist = { version = "1.10", default-features = false, features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
time = { version = "0.3", features = ["parsing"] }
zerus-watch-protocol = { path = "../../crates/watch-protocol" }
zerus-desktop-migration = { path = "../../crates/desktop-migration" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
socket2 = "0.6"

# Konsole tabs and raising over the session D-Bus (libdbus); the Linux app
# turns it on, while the crate's own checks build without it.
[target.'cfg(target_os = "linux")'.dependencies]
dbus = { version = "0.9", optional = true }
# Explicit native-method opt-in only; the default core/root stays passive.
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"], optional = true }
async-io = { version = "2.6", optional = true }
futures-lite = { version = "2.6", optional = true }
# Probe only: refuse a Tokio context so zbus always uses its owned async-io
# executor. Its Tokio executor reports is_empty=true without task accounting.
tokio = { version = "1", default-features = false, features = ["rt"], optional = true }

# macOS: the quarantine a file from another machine carries (external_file).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSDictionary", "NSError", "NSObject", "NSString", "NSURL"] }

# Windows: the Terminal's attach client in a ConPTY pseudoconsole, the Mark
# of the Web and the shell's dangerous types (external_file), starting
# terminals and console windows (terminal_launch), and this process's Windows
# session (launch::own_windows_session).
[target.'cfg(windows)'.dependencies]
unicode-casefold = "0.2"
windows-sys = { version = "0.61", features = ["Wdk_System_Threading", "Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_Environment", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Kernel", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_UI_Shell"] }

[features]
konsole = ["dep:dbus"]
linux-native-notify = ["dep:zbus", "dep:async-io", "dep:futures-lite", "dep:tokio"]
# Read-only live-code observations on an existing Mac connection, opt-in only.
macos-native-peer = ["objc2-foundation/NSData", "objc2-foundation/NSValue"]

[[bin]]
name = "fake-hgs-launcher"
path = "tests/support/fake_hgs_launcher.rs"
