name: CI checks

on:
  workflow_call:
    inputs:
      ref:
        description: Commit or ref to test
        type: string
        default: ''
      run_linux:
        type: boolean
        default: false
      run_arch:
        type: boolean
        default: false
      run_macos:
        type: boolean
        default: false
      run_windows:
        type: boolean
        default: false
      windows_installer_version:
        description: Installer release version (empty uses the ZIP product version)
        type: string
        default: ''
      run_ios:
        type: boolean
        default: false
      filter_pr_platforms:
        type: boolean
        default: false
      # Only the trusted main checks in ci.yml, whose token can write caches,
      # pass true. Every other caller restores caches and never saves them.
      save_caches:
        description: Save refreshed build caches
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  source:
    name: Resolve commit
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.revision.outputs.commit }}
      run_linux: ${{ steps.revision.outputs.run_linux }}
      run_arch: ${{ steps.revision.outputs.run_arch }}
      run_macos: ${{ steps.revision.outputs.run_macos }}
      run_windows: ${{ steps.revision.outputs.run_windows }}
      run_ios: ${{ steps.revision.outputs.run_ios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record exact test commit and selected coverage
        id: revision
        env:
          RUN_LINUX: ${{ inputs.run_linux }}
          RUN_ARCH: ${{ inputs.run_arch }}
          RUN_MACOS: ${{ inputs.run_macos }}
          RUN_WINDOWS: ${{ inputs.run_windows }}
          RUN_IOS: ${{ inputs.run_ios }}
          FILTER_PR_PLATFORMS: ${{ inputs.filter_pr_platforms }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python3 scripts/ci/select-coverage.py

  client-frontend:
    name: Desktop frontend tests and build
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
        working-directory: client
      - run: npm run check
        working-directory: client
      - run: npm test
        working-directory: client
      - run: npm run build
        working-directory: client
      - name: Main JavaScript chunk budget
        run: python3 client/scripts/check-bundle-size.py

  quick:
    name: Quick checks (source and Rust 1.99)
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reclaim unused hosted Ubuntu tools
        run: python3 scripts/ci/ubuntu-disk.py prepare
      - run: python3 scripts/ci/check-source.py
      - name: No dot separators in the web UI
        run: python3 scripts/check-ui-separators.py
      - name: Desktop client measurement page
        run: python3 -m unittest discover -s client/scripts -p 'test_*.py' -v
      - name: Standalone speech HTTP contracts
        run: |
          python3 -m venv "$RUNNER_TEMP/speech-http-venv"
          "$RUNNER_TEMP/speech-http-venv/bin/pip" install './services/speech[http]'
          "$RUNNER_TEMP/speech-http-venv/bin/python" -m unittest discover -s services/speech/tests -v
      - name: Release publication contract checks
        run: python3 -m unittest discover -s tests -p 'test_*publication.py'
      - name: Windows installer and runtime prerequisite contracts
        working-directory: tests
        run: python3 -m unittest test_windows_installer test_webview2_ci
      - name: Linux package staging contracts
        run: python3 -m unittest discover -s tests -p test_linux_packaging.py
      - name: Linux desktop service registration contracts
        run: python3 -m unittest discover -s tests -p test_linux_desktop_service.py
      - name: Hosted Ubuntu disk cleanup contracts
        run: python3 -m unittest discover -s tests -p test_ci_disk.py
      - name: Workflow trust boundary checks
        run: python3 -m unittest discover -s tests -p test_ci_security.py
      - name: Scan the tree and all history for secrets
        shell: bash
        run: |
          set -euo pipefail
          scan_dir=$(mktemp -d)
          cd "$scan_dir"
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz' | sha256sum --check --strict
          tar xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          # Negative control: a token generated here, committed and then deleted,
          # must fail the same history scan, so a silenced scanner cannot pass.
          mkdir control
          git -C control init -q
          python3 -c 'import secrets, string; print("token = \"ghp_" + "".join(secrets.choice(string.ascii_letters + string.digits) for _ in range(36)) + "\"  # gitleaks:allow")' > control/leak.py
          git -C control add leak.py
          git -C control -c user.name=ci -c user.email=ci@example.invalid commit -qm add
          git -C control rm -q leak.py
          git -C control -c user.name=ci -c user.email=ci@example.invalid commit -qm remove
          status=0
          "$scan_dir/gitleaks" git --no-banner --redact --ignore-gitleaks-allow --exit-code 3 control || status=$?
          if [ "$status" != 3 ]; then
            echo "::error::Gitleaks did not report the generated control token (exit $status)."
            exit 1
          fi
          cd "$GITHUB_WORKSPACE"
          "$scan_dir/gitleaks" git --no-banner --redact --ignore-gitleaks-allow --exit-code 1 .
          "$scan_dir/gitleaks" dir --no-banner --redact --ignore-gitleaks-allow --exit-code 1 .
      - name: Validate GitHub Actions
        shell: bash
        run: |
          set -euo pipefail
          lint_dir=$(mktemp -d)
          cd "$lint_dir"
          curl -fsSLO https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          curl -fsSLO https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_checksums.txt
          sha256sum --check --ignore-missing actionlint_1.7.12_checksums.txt
          tar xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          cd "$GITHUB_WORKSPACE"
          "$lint_dir/actionlint" -color -ignore 'unexpected key "cache-mode" for "(workflow|job)" section'

      - run: rustup toolchain install 1.99.1 --profile minimal
      # Rust caches: the compiler identity and a monthly epoch precede the lock
      # hash. A Cargo.lock change restores the previous target; a new month or
      # compiler starts afresh, so stale dependency builds cannot accumulate.
      - name: Rust cache identity
        id: rust
        run: |
          echo "rustc=$(rustc +1.99.1 -Vv | git hash-object --stdin | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "epoch=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Restore Rust 1.99 cache
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: msrv-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.rustc }}-${{ steps.rust.outputs.epoch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: msrv-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.rustc }}-${{ steps.rust.outputs.epoch }}-
      - name: Disk usage after cache restore
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/ubuntu-disk.py report after-cache-restore
      - run: cargo +1.99.1 test --locked
      - name: Disk usage after root tests
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/ubuntu-disk.py report after-root-tests
      - name: Client readiness fixture matches root service status
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.99.1 test --locked --bin hgs desktop::delivery::tests::actual_root_projection_is_consumed_by_the_client_without_ready_json_fixtures -- --exact --nocapture |
            python3 client/scripts/generate-delivery-status-fixture.py --check
      - name: Replica crates (format, lints, tests, golden vectors, the mobile binding surface)
        run: |
          rustup component add --toolchain 1.99.1 rustfmt clippy
          cargo +1.99.1 fmt --check --manifest-path crates/replica/Cargo.toml
          cargo +1.99.1 clippy --locked --manifest-path crates/replica/Cargo.toml --target-dir target --all-targets -- -D warnings
          cargo +1.99.1 test --locked --manifest-path crates/replica/Cargo.toml --target-dir target
          cargo +1.99.1 fmt --check --manifest-path crates/replica-ffi/Cargo.toml
          cargo +1.99.1 clippy --locked --manifest-path crates/replica-ffi/Cargo.toml --target-dir target --all-targets -- -D warnings
          cargo +1.99.1 test --locked --manifest-path crates/replica-ffi/Cargo.toml --target-dir target
      - name: Disk usage after replica tests
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/ubuntu-disk.py report after-replica-tests
      - name: Watch protocol crate (format, lints, tests)
        run: |
          cargo +1.99.1 fmt --check --manifest-path crates/watch-protocol/Cargo.toml
          cargo +1.99.1 clippy --locked --manifest-path crates/watch-protocol/Cargo.toml --target-dir target --all-targets -- -D warnings
          cargo +1.99.1 test --locked --manifest-path crates/watch-protocol/Cargo.toml --target-dir target
      - name: Disk usage after watch tests
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/ubuntu-disk.py report after-watch-tests
      - name: Desktop client core crate (format, lints, tests)
        run: |
          cargo +1.99.1 fmt --check --manifest-path client/core/Cargo.toml
          cargo +1.99.1 clippy --locked --manifest-path client/core/Cargo.toml --target-dir target --all-targets -- -D warnings
          cargo +1.99.1 test --locked --manifest-path client/core/Cargo.toml --target-dir target
      # hgs and client/core take these by path, which builds them but never runs their tests.
      # Every Quick Cargo check shares target: compatible dependencies are built once.
      - name: Disk usage after client core tests
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/ubuntu-disk.py report after-client-core-tests
      - name: Desktop crates (format, lints, tests)
        run: |
          cargo +1.99.1 fmt --check --manifest-path crates/content-search/Cargo.toml
          cargo +1.99.1 clippy --locked --manifest-path crates/content-search/Cargo.toml --target-dir target --all-targets -- -D warnings
          cargo +1.99.1 test --locked --manifest-path crates/content-search/Cargo.toml --target-dir target
          cargo +1.99.1 fmt --check --manifest-path crates/desktop-catalog/Cargo.toml
          cargo +1.99.1 clippy --locked --manifest-path crates/desktop-catalog/Cargo.toml --target-dir target --all-targets -- -D warnings
          cargo +1.99.1 test --locked --manifest-path crates/desktop-catalog/Cargo.toml --target-dir target
          cargo +1.99.1 fmt --check --manifest-path crates/desktop-ledger/Cargo.toml
          cargo +1.99.1 clippy --locked --manifest-path crates/desktop-ledger/Cargo.toml --target-dir target --all-targets -- -D warnings
          cargo +1.99.1 test --locked --manifest-path crates/desktop-ledger/Cargo.toml --target-dir target
          cargo +1.99.1 fmt --check --manifest-path crates/desktop-migration/Cargo.toml
          cargo +1.99.1 clippy --locked --manifest-path crates/desktop-migration/Cargo.toml --target-dir target --all-targets -- -D warnings
          cargo +1.99.1 test --locked --manifest-path crates/desktop-migration/Cargo.toml --target-dir target
          cargo +1.99.1 fmt --check --manifest-path crates/desktop-read-policy/Cargo.toml
          cargo +1.99.1 clippy --locked --manifest-path crates/desktop-read-policy/Cargo.toml --target-dir target --all-targets -- -D warnings
          cargo +1.99.1 test --locked --manifest-path crates/desktop-read-policy/Cargo.toml --target-dir target
          cargo +1.99.1 fmt --check --manifest-path crates/presence-sampler/Cargo.toml
          cargo +1.99.1 clippy --locked --manifest-path crates/presence-sampler/Cargo.toml --target-dir target --all-targets -- -D warnings
          cargo +1.99.1 test --locked --manifest-path crates/presence-sampler/Cargo.toml --target-dir target
      - name: Disk usage after desktop crate tests
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/ubuntu-disk.py report after-desktop-crate-tests
      - name: Freedesktop notification wire crate (format, lints, private bus tests)
        run: |
          sudo apt-get update && sudo apt-get install --no-install-recommends -y dbus-daemon
          cargo +1.99.1 fmt --check --manifest-path crates/freedesktop-notify/Cargo.toml
          cargo +1.99.1 clippy --locked --manifest-path crates/freedesktop-notify/Cargo.toml --target-dir target --all-targets -- -D warnings
          cargo +1.99.1 test --locked --manifest-path crates/freedesktop-notify/Cargo.toml --target-dir target
      # Packages fail without a notice for every shipped crate; find out here.
      - name: Disk usage after notification tests
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/ubuntu-disk.py report after-notification-tests
      - name: Rust license notices
        run: python3 scripts/collect-licenses.py "$RUNNER_TEMP/rust-licenses"
      - name: Save Rust 1.99 cache
        if: inputs.save_caches && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Disk usage after cache save
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/ubuntu-disk.py report after-cache-save

  relay:
    name: Rust relay (v1, PostgreSQL and connector contracts)
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          # The Rust contracts and relay fixtures create and drop their own databases.
        ports: [5432/tcp]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - name: Reclaim unused hosted Ubuntu tools
        run: python3 scripts/ci/ubuntu-disk.py prepare
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      # Each storage contract and relay fixture creates and drops its own
      # database on the service. With the requirement set, a missing URL fails
      # instead of falling back to SQLite or skipping.
      - name: Rust format, lint and PostgreSQL storage contracts
        working-directory: services/mobile/relay
        env:
          ZERUS_RELAY_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
          ZERUS_REQUIRE_RELAY_E2E: "1"
        run: |
          cargo +1.99.1 fmt --check
          cargo +1.99.1 clippy --locked --all-targets -- -D warnings
          cargo +1.99.1 test --locked
          cargo +1.99.1 test --locked --test contracts postgres_cross_worker -- --ignored
          # The connector links only the protocol library: it builds without the
          # server stack, reproduces the golden vectors, and no build may give
          # serde_json insertion-ordered maps.
          cargo +1.99.1 clippy --locked --no-default-features --lib --test codec --test vectors -- -D warnings
          cargo +1.99.1 build --locked --no-default-features --lib
          cargo +1.99.1 test --locked --no-default-features --test codec --test vectors
          library="$(cargo +1.99.1 tree --locked --no-default-features --target all -e normal --prefix none)"
          if grep -E '^(axum|clap|hyper|reqwest|ring|rustls|sqlx|tokio|tower)[ -]' <<<"$library"; then
            echo "The protocol library depends on server crates" >&2
            exit 1
          fi
          serde_features() {
            features="$(cargo +1.99.1 tree --locked --target all -e features -i serde_json "$@")"
            if ! grep -q 'serde_json feature "arbitrary_precision"' <<<"$features" \
              || grep -q 'serde_json feature "preserve_order"' <<<"$features"; then
              echo "serde_json needs arbitrary_precision and must not preserve_order $*" >&2
              exit 1
            fi
          }
          serde_features
          serde_features --no-default-features
      - name: Disk usage after relay contracts
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/ubuntu-disk.py report after-relay-contracts
      - name: Encrypted endpoint protocol and workspace contracts
        env:
          ZERUS_RELAY_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
          ZERUS_REQUIRE_RELAY_E2E: "1"
        run: |
          cargo +1.99.1 fmt --manifest-path services/mobile/crypto/Cargo.toml --check
          cargo +1.99.1 clippy --locked --manifest-path services/mobile/crypto/Cargo.toml --all-targets -- -D warnings
          cargo +1.99.1 test --locked --manifest-path services/mobile/crypto/Cargo.toml
          cargo +1.99.1 fmt --manifest-path services/mobile/workspace-tests/Cargo.toml --check
          cargo +1.99.1 clippy --locked --manifest-path services/mobile/workspace-tests/Cargo.toml --target-dir services/mobile/relay/target --all-targets -- -D warnings
          cargo +1.99.1 test --locked --manifest-path services/mobile/workspace-tests/Cargo.toml --target-dir services/mobile/relay/target
      # Every services/mobile/tests module runs once, and relay fixtures run the
      # Rust process on their own PostgreSQL databases. The speech suites also
      # run against the retained Python reference relay. The black-box connector
      # suites (test_bb_*) run in the connector job; the end-to-end suites run
      # here against both connectors, the Rust one built beside the relay.
      - name: Disk usage after crypto contracts
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/ubuntu-disk.py report after-crypto-contracts
      - name: Released HTTP and outbound connector compatibility
        env:
          ZERUS_RELAY_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
          ZERUS_REQUIRE_RELAY_E2E: "1"
        run: |
          cargo +1.99.1 build --locked --bin hgs
          cargo +1.99.1 build --locked --manifest-path services/mobile/connector/Cargo.toml --target-dir services/mobile/relay/target
          export ZERUS_CONNECTOR_E2E_COMMAND="$GITHUB_WORKSPACE/services/mobile/relay/target/debug/zerus-mobile-connector"
          python3 -m venv "$RUNNER_TEMP/relay-venv"
          "$RUNNER_TEMP/relay-venv/bin/pip" install ./services/mobile -r services/mobile/tests/requirements.txt
          export ZERUS_RELAY_BINARY="$GITHUB_WORKSPACE/services/mobile/relay/target/debug/zerus-relay"
          export ZERUS_DIRECTORY_TEST_HGS="$GITHUB_WORKSPACE/target/debug/hgs"
          export ZERUS_TASK_TEST_HGS="$GITHUB_WORKSPACE/target/debug/hgs"
          export PATH="$GITHUB_WORKSPACE/services/mobile/relay/target/debug:$PATH"
          "$RUNNER_TEMP/relay-venv/bin/python" -m unittest discover -s services/mobile/tests -p 'test_[!b]*.py' -v
          env -u ZERUS_RELAY_BINARY "$RUNNER_TEMP/relay-venv/bin/python" -m unittest discover -s services/mobile/tests -p 'test_mobile_speech*.py' -v
      - name: Retire completed relay host build outputs
        run: python3 scripts/ci/ubuntu-disk.py relay-before-image
      - name: Build the deployment image
        run: docker build --tag zerus-relay-contract services/mobile
      - name: Disk usage after deployment image
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/ubuntu-disk.py report after-deployment-image
      - name: Enforce the 256 MiB runtime envelope
        run: |
          "$RUNNER_TEMP/relay-venv/bin/python" services/mobile/relay/tests/load.py --kind attachments_unicode
          "$RUNNER_TEMP/relay-venv/bin/python" services/mobile/relay/tests/load.py --kind late-malformed
          "$RUNNER_TEMP/relay-venv/bin/python" services/mobile/relay/tests/load.py --kind attachments_unicode --repeats 2 --concurrency 2
          "$RUNNER_TEMP/relay-venv/bin/python" services/mobile/relay/tests/load.py --kind attachments_unicode --backend postgres
      - name: Disk usage after runtime envelope
        if: ${{ !cancelled() }}
        run: python3 scripts/ci/ubuntu-disk.py report after-runtime-envelope

  # The Rust connector against the golden vectors, the Python connector and hgs
  # on one journal, and the black-box suites against both implementations.
  connector:
    name: Rust mobile connector (Rust 1.99 and black-box suites)
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # The cache keeps dependency builds; incremental state of this crate
      # changes with every commit and would only enlarge it.
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Rust cache identity
        id: rust
        run: |
          echo "rustc=$(rustc +1.99.1 -Vv | git hash-object --stdin | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "epoch=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Restore connector Rust cache
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/mobile/connector/target
          key: connector-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.rustc }}-${{ steps.rust.outputs.epoch }}-${{ hashFiles('services/mobile/connector/Cargo.lock') }}
          restore-keys: connector-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.rustc }}-${{ steps.rust.outputs.epoch }}-
      - name: Format, lint and dependency boundaries
        working-directory: services/mobile/connector
        run: |
          cargo +1.99.1 fmt --check
          cargo +1.99.1 clippy --locked --all-targets -- -D warnings
          cargo +1.99.1 clippy --locked --all-targets --features test-hooks -- -D warnings
          cargo +1.99.1 build --locked --features test-hooks
          cargo +1.99.1 build --locked
          # The black-box test seams exist only with the test-hooks feature.
          if grep -q ZERUS_CONNECTOR_TEST_ target/debug/zerus-mobile-connector; then
            echo "A build without test-hooks reads ZERUS_CONNECTOR_TEST_ variables" >&2
            exit 1
          fi
          # No server, database, TLS-library or proxy-aware HTTP stack in the lock.
          if grep -E '^name = "(axum|sqlx|reqwest|openssl-sys|native-tls)"$' Cargo.lock; then
            echo "The connector lock holds a forbidden crate" >&2
            exit 1
          fi
          # request_hash needs exact numbers, and no build may give serde_json
          # insertion-ordered maps.
          features="$(cargo +1.99.1 tree --locked --target all -e features -i serde_json)"
          if ! grep -q 'serde_json feature "arbitrary_precision"' <<<"$features" \
            || grep -q 'serde_json feature "preserve_order"' <<<"$features"; then
            echo "serde_json needs arbitrary_precision and must not preserve_order" >&2
            exit 1
          fi
      - name: Python connector and hgs for the handoff tests
        run: |
          cargo +1.99.1 build --locked --bin hgs
          python3 -m venv "$RUNNER_TEMP/connector-venv"
          "$RUNNER_TEMP/connector-venv/bin/pip" install ./services/mobile
      - name: Vector, binary and handoff tests
        working-directory: services/mobile/connector
        env:
          ZERUS_CONNECTOR_TEST_PYTHON: ${{ runner.temp }}/connector-venv/bin/python
          ZERUS_CONNECTOR_TEST_HGS: ${{ github.workspace }}/target/debug/hgs
        run: cargo +1.99.1 test --locked
      - name: Save connector Rust cache
        if: inputs.save_caches && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            services/mobile/connector/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      # One venv per commit recorded as a rollback baseline, for the journal
      # handoff tests (test_bb_handoff.py); none is recorded before a cutover.
      - name: Rollback baseline Python connectors
        run: |
          commands=""
          for commit in $(python3 -c 'import json, sys; print(*(b["commit"] for b in json.load(open(sys.argv[1]))["baselines"]))' \
              services/mobile/tests/rollback-baselines.json); do
            git fetch --no-tags --depth 1 origin "$commit"
            mkdir "$RUNNER_TEMP/baseline-$commit"
            git archive "$commit" services/mobile | tar -x -C "$RUNNER_TEMP/baseline-$commit"
            python3 -m venv "$RUNNER_TEMP/rollback-$commit"
            "$RUNNER_TEMP/rollback-$commit/bin/pip" install "$RUNNER_TEMP/baseline-$commit/services/mobile"
            commands="$commands${commands:+:}$RUNNER_TEMP/rollback-$commit/bin/zerus-mobile-connector"
          done
          echo "ZERUS_CONNECTOR_ROLLBACK_COMMANDS=$commands" >> "$GITHUB_ENV"
      # The Python run covers every module; the Rust run only those in ported.json,
      # against a build with the test-hooks seams (cargo test rebuilt it without).
      # Both write differential traces, compared at the end, and they run beside
      # the soak of the Rust build: the connectors' own clocks set their pace.
      - name: Black-box suites against the Python and Rust connectors, differential traces and soak
        run: |
          (cd services/mobile/connector && cargo +1.99.1 build --locked --features test-hooks)
          rust="$GITHUB_WORKSPACE/services/mobile/connector/target/debug/zerus-mobile-connector"
          traces="$RUNNER_TEMP/traces"
          ZERUS_CONNECTOR_TRACE_DIR="$traces/python" \
            "$RUNNER_TEMP/connector-venv/bin/python" -m unittest discover -s services/mobile/tests -p 'test_bb_*.py' -v \
            > "$RUNNER_TEMP/python.log" 2>&1 &
          python=$!
          ZERUS_CONNECTOR_TRACE_DIR="$traces/rust" ZERUS_CONNECTOR_COMMAND="$rust" \
            "$RUNNER_TEMP/connector-venv/bin/python" -m unittest discover -s services/mobile/tests -p 'test_bb_*.py' -v \
            > "$RUNNER_TEMP/rust.log" 2>&1 &
          rust_suites=$!
          ZERUS_CONNECTOR_SOAK_SECONDS=300 ZERUS_CONNECTOR_COMMAND="$rust" \
            "$RUNNER_TEMP/connector-venv/bin/python" -m unittest discover -s services/mobile/tests -p test_bb_soak.py -v \
            > "$RUNNER_TEMP/soak.log" 2>&1 &
          soak=$!
          status=0
          finish() {
            if wait "$2"; then
              echo "::group::$1"; cat "$RUNNER_TEMP/$1.log"; echo "::endgroup::"
            else
              echo "::error::$1 black-box run failed"; cat "$RUNNER_TEMP/$1.log"; status=1
            fi
          }
          finish python "$python"
          finish rust "$rust_suites"
          finish soak "$soak"
          "$RUNNER_TEMP/connector-venv/bin/python" services/mobile/tests/differential.py compare \
            "$traces/python" "$traces/rust" || status=1
          exit "$status"

  # The connector on macOS (design C7): a cold Rust 1.99 build, its unit,
  # vector and binary tests, and the black-box modules that need no real hgs
  # against the build with the test seams, with Keychain trust and kqueue. The
  # journal handoffs run this tree's Python connector beside it.
  connector-macos:
    name: Rust mobile connector on macOS (smoke)
    needs: source
    if: needs.source.outputs.run_macos == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal
      - name: Python connector for the handoffs
        run: |
          python3 -m venv "$RUNNER_TEMP/connector-venv"
          "$RUNNER_TEMP/connector-venv/bin/pip" install ./services/mobile
      - name: Unit, vector and binary tests
        working-directory: services/mobile/connector
        run: |
          cargo +1.99.1 test --locked --lib --test config_vectors --test journal_vectors --test runtime_vectors \
            --test mutations --test launch_runtime --test binary
      - name: Black-box smoke against the Rust connector
        working-directory: services/mobile/tests
        run: |
          (cd ../connector && cargo +1.99.1 build --locked --features test-hooks)
          ZERUS_CONNECTOR_COMMAND="$GITHUB_WORKSPACE/services/mobile/connector/target/debug/zerus-mobile-connector" \
            "$RUNNER_TEMP/connector-venv/bin/python" -m unittest -v test_bb_harness test_bb_startup test_bb_journal \
            test_bb_requests test_bb_restart test_bb_retention test_bb_heartbeat test_bb_runtime test_bb_send \
            test_bb_signals test_bb_handoff

  # The iOS client with the other macOS suites: ZerusKit unit tests on the host and
  # an unsigned simulator build of the app. No signing identity reaches this job.
  ios:
    name: iOS core tests and simulator build
    needs: source
    if: needs.source.outputs.run_ios == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    env:
      SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - name: Select Xcode 26 or later
        run: bash mobile/ios/scripts/select-xcode.sh
      - name: Rust for the project task replica
        run: rustup toolchain install 1.99.1 --profile minimal --target aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin
      # This check builds five Apple slices on every run: without the release profile's
      # whole-program optimisation, which only TestFlight's smaller binary needs.
      - name: Project task replica library
        env:
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: RUSTUP_TOOLCHAIN=1.99.1 bash mobile/ios/scripts/build-replica.sh
      - name: ZerusKit tests
        working-directory: mobile/ios/ZerusKit
        run: swift test
      - name: Simulator build
        run: |
          xcodebuild -project mobile/ios/Zerus.xcodeproj -scheme Zerus -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/ios-derived-data" \
            CODE_SIGNING_ALLOWED=NO ZERUS_SOURCE_REVISION="${SOURCE_COMMIT:0:12}" build

  # Every run, PRs included, tests and lints the Firebase variant that the signed
  # Dev build ships. A synthetic configuration with placeholder values stands in
  # for the private one; no signer or Firebase project reaches this job.
  android:
    name: Android unit tests and lint
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - name: JDK 17 and synthetic Firebase configuration
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          cat > mobile/android/app/google-services.json <<'JSON'
          {
            "project_info": {"project_number": "000000000000", "project_id": "zerus-ci-example"},
            "client": [{
              "client_info": {"mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                              "android_client_info": {"package_name": "app.zerus.mobile"}},
              "api_key": [{"current_key": "synthetic-placeholder"}]
            }],
            "configuration_version": "1"
          }
          JSON
      - name: Android platform, build tools and NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      # Gradle caches: a monthly epoch precedes the hash of the wrapper and build
      # scripts. A dependency change restores the previous entry; a new month
      # starts afresh, so unused artifacts cannot accumulate.
      - name: Gradle cache identity
        id: gradle
        run: echo "epoch=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Restore Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Cargo's registry and the installed cargo-ndk (with Cargo's records of it) travel along.
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/bin/cargo-ndk
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: android-gradle-v1-${{ steps.gradle.outputs.epoch }}-${{ hashFiles('mobile/android/gradle/wrapper/gradle-wrapper.properties', 'mobile/android/**/*.gradle.kts', 'crates/replica/Cargo.lock', 'crates/replica-ffi/Cargo.lock') }}
          restore-keys: android-gradle-v1-${{ steps.gradle.outputs.epoch }}-
      # The task replica (crates/replica-ffi) is built for every packaged ABI; cargo-ndk
      # comes from the cache when it holds this version.
      - name: Rust and cargo-ndk for the task replica
        run: |
          rustup toolchain install 1.99.1 --profile minimal --target aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
          cargo +1.99.1 install cargo-ndk --version 4.1.2 --locked
      - name: Unit tests and release lint
        working-directory: mobile/android
        run: ./gradlew --no-daemon testDebugUnitTest lintRelease checkReplicaPackaging -PzerusFirebase=true
      - name: Collect approval publication and binding unit results
        if: always()
        run: |
          mkdir -p artifacts/android-approval-unit-results
          cp mobile/android/app/build/test-results/testDebugUnitTest/TEST-app.zerus.mobile.InspectionPublicationTest.xml artifacts/android-approval-unit-results/
          cp mobile/android/app/build/test-results/testDebugUnitTest/TEST-app.zerus.mobile.QuestionSendConfirmationTest.xml artifacts/android-approval-unit-results/
          cp mobile/android/app/build/test-results/testDebugUnitTest/TEST-app.zerus.mobile.QuestionReviewProbeTest.xml artifacts/android-approval-unit-results/
      - name: Retain approval publication and binding unit results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-approval-unit-results
          path: |
            artifacts/android-approval-unit-results/TEST-app.zerus.mobile.InspectionPublicationTest.xml
            artifacts/android-approval-unit-results/TEST-app.zerus.mobile.QuestionSendConfirmationTest.xml
            artifacts/android-approval-unit-results/TEST-app.zerus.mobile.QuestionReviewProbeTest.xml
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'schedule' && 3 || 7 }}
      # Third-party notices must list exactly what the published Firebase release
      # build resolves, with the notices inside its resolved artifacts.
      - name: Android library notices match the release classpath
        working-directory: mobile/android
        run: |
          ./gradlew --no-daemon -q --init-script ../../scripts/android-resolved-artifacts.gradle -PzerusFirebase=true :app:zerusResolvedNotices
          python3 -I ../../scripts/android-notices.py --check
      - name: Save Gradle cache
        if: inputs.save_caches && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/bin/cargo-ndk
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}
      - name: Collect Android reports
        if: failure()
        run: |
          mkdir -p artifacts/test-results
          cp -R mobile/android/app/build/reports artifacts/test-results/android || true
          mkdir -p artifacts/test-results/camera-video-fixed
          cp -R mobile/android/camera-video-fixed/build/reports artifacts/test-results/camera-video-fixed/reports || true
          cp -R mobile/android/camera-video-fixed/build/test-results artifacts/test-results/camera-video-fixed/test-results || true
      - name: Retain Android reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-results
          path: artifacts/test-results
          retention-days: ${{ github.event_name == 'schedule' && 3 || 7 }}

  client-native-linux:
    name: Desktop client native checks (ubuntu-24.04)
    needs: source
    if: needs.source.outputs.run_linux == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - name: Linux media, video and Tauri build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --no-install-recommends -y
          libasound2-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
          gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
          libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev xvfb dbus-bin dbus-daemon
      - run: rustup toolchain install 1.99.1 --profile minimal --component clippy
      - name: Rust cache identity
        id: rust
        run: |
          echo "rustc=$(rustc +1.99.1 -Vv | git hash-object --stdin | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "epoch=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Restore native client Rust cache
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: client-native-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.rustc }}-${{ steps.rust.outputs.epoch }}-${{ hashFiles('client/core/Cargo.lock', 'client/media/Cargo.lock', 'client/src-tauri/Cargo.lock') }}
          restore-keys: client-native-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.rustc }}-${{ steps.rust.outputs.epoch }}-
      - name: Media and video tests and Tauri media clippy
        run: bash scripts/ci/client-native.sh linux
      - name: Save native client Rust cache
        if: inputs.save_caches && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

  client-native-macos-core:
    name: Desktop client core checks (macos-15)
    needs: source
    if: needs.source.outputs.run_macos == 'true'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal --component clippy
      - name: Rust cache identity
        id: rust
        run: |
          echo "rustc=$(rustc +1.99.1 -Vv | git hash-object --stdin | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "epoch=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Restore native client Rust cache
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: client-native-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.rustc }}-${{ steps.rust.outputs.epoch }}-${{ hashFiles('client/core/Cargo.lock', 'client/media/Cargo.lock', 'client/src-tauri/Cargo.lock') }}
          restore-keys: client-native-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.rustc }}-${{ steps.rust.outputs.epoch }}-
      - name: Core tests
        run: bash scripts/ci/client-native.sh macos core
      - name: Media and video check
        run: bash scripts/ci/client-native.sh macos media

  client-native-macos-tauri:
    name: Desktop client Tauri checks (macos-15)
    needs: source
    if: needs.source.outputs.run_macos == 'true'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal --component clippy
      - name: Rust cache identity
        id: rust
        run: |
          echo "rustc=$(rustc +1.99.1 -Vv | git hash-object --stdin | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "epoch=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Restore native client Rust cache
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: client-native-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.rustc }}-${{ steps.rust.outputs.epoch }}-${{ hashFiles('client/core/Cargo.lock', 'client/media/Cargo.lock', 'client/src-tauri/Cargo.lock') }}
          restore-keys: client-native-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.rustc }}-${{ steps.rust.outputs.epoch }}-
      - name: Tauri tests
        timeout-minutes: 25
