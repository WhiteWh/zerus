        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

  client-native-windows:
    name: Desktop client native checks (windows-2025)
    needs: source
    if: needs.source.outputs.run_windows == 'true'
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - name: Check out text files unchanged
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal --component clippy
      - name: Rust cache identity
        id: rust
        run: |
          echo "rustc=$(rustc +1.99.1 -Vv | git hash-object --stdin | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "epoch=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Restore native client Rust cache
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: client-native-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.rustc }}-${{ steps.rust.outputs.epoch }}-${{ hashFiles('client/core/Cargo.lock', 'client/media/Cargo.lock', 'client/src-tauri/Cargo.lock') }}
          restore-keys: client-native-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.rustc }}-${{ steps.rust.outputs.epoch }}-
      - name: Core tests
        run: bash scripts/ci/client-native.sh windows core
      - name: Media checks
        if: ${{ !cancelled() }}
        run: bash scripts/ci/client-native.sh windows media
      - name: Tauri clippy
        if: ${{ !cancelled() }}
        run: bash scripts/ci/client-native.sh windows tauri-clippy
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ !cancelled() }}
        with:
          node-version: '24'
      - name: Windows shell tests and disposable app
        if: ${{ !cancelled() }}
        run: bash scripts/ci/windows-next-shell.sh
      - name: Retain disposable Windows shell
        if: ${{ !cancelled() && hashFiles('artifacts/zerus-next-windows-shell/hgs-tray.exe') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zerus-next-windows-shell
          path: artifacts/zerus-next-windows-shell
          retention-days: 3
          if-no-files-found: error
      - name: Retain Windows shell loader diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-shell-loader
          path: artifacts/windows-shell-loader
          retention-days: 3
          if-no-files-found: ignore
      - name: Save native client Rust cache
        if: inputs.save_caches && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

  cli:
    name: CLI (ubuntu-24.04)
    needs: source
    if: needs.source.outputs.run_linux == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_TERM_COLOR: always
      HOMEBREW_NO_AUTO_UPDATE: 1
      # Python integration jobs mostly wait on terminals and subprocesses: twice
      # the 4 Linux runner vCPUs.
      ZERUS_PYTHON_JOBS: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - name: Linux test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libevent-dev libncurses-dev bison pkg-config fish
      - name: Pinned tmux with verified input-mode support
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash scripts/ci/install-tmux.sh "$RUNNER_TEMP/tmux"
          echo "$RUNNER_TEMP/tmux/bin" >> "$GITHUB_PATH"
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Rust cache identity
        id: rust
        run: |
          echo "rustc=$(rustc -Vv | git hash-object --stdin | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "epoch=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Restore Rust cache
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.rustc }}-${{ steps.rust.outputs.epoch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.rustc }}-${{ steps.rust.outputs.epoch }}-
      # Resolve one latest official release, record its complete registry-only
      # source lock before installation, and retain the install identity for the
      # mandatory native suites. node_modules stays outside source/caches/artifacts.
      - name: Keyless official DeepSeek contract fixture
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 scripts/ci/dsh_fixture.py --prefix "$RUNNER_TEMP/dsh" \
            --evidence "$GITHUB_WORKSPACE/artifacts/test-results/dsh-fixture"
          echo "$RUNNER_TEMP/dsh/node_modules/.bin" >> "$GITHUB_PATH"
          echo "ZERUS_TEST_DSH_RECEIPT=$GITHUB_WORKSPACE/artifacts/test-results/dsh-fixture/installed.json" >> "$GITHUB_ENV"
      - run: bash scripts/ci/cli.sh
      # U62: every test file and every source area is in .zerus/test-map.json.
      - name: The test map is current
        run: target/debug/hgs test map --check
      - name: Save Rust cache
        if: inputs.save_caches && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Keyless latest Codex, Claude Code and OpenCode compatibility
        run: python3 scripts/ci/agent-compatibility.py
      - name: Retain test logs
        if: always() && (github.event_name != 'schedule' || failure())
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-results-${{ runner.os }}-${{ runner.arch }}
          path: artifacts/test-results
          retention-days: ${{ github.event_name == 'schedule' && 3 || 7 }}

  # A completed producer, not an early upload from a still-running CLI job.
  cli-macos-debug:
    name: macOS CLI unit and debug build
    needs: source
    if: needs.source.outputs.run_macos == 'true'
    runs-on: macos-15
    timeout-minutes: 35
    outputs:
      artifact_id: ${{ steps.debug-upload.outputs.artifact-id }}
      manifest_sha256: ${{ steps.seal.outputs.manifest_sha256 }}
      producer_attempt: ${{ steps.seal.outputs.producer_attempt }}
      rust_release: ${{ steps.seal.outputs.rust_release }}
    env:
      CARGO_TERM_COLOR: always
      HOMEBREW_NO_AUTO_UPDATE: 1
      SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - name: macOS test dependencies
        run: brew install tmux python
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Rust cache identity
        id: rust
        run: |
          echo "rustc=$(rustc -Vv | git hash-object --stdin | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "epoch=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Restore Rust cache
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.rustc }}-${{ steps.rust.outputs.epoch }}-${{ hashFiles('Cargo.lock') }}debug
          restore-keys: |
            cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.rustc }}-${{ steps.rust.outputs.epoch }}-${{ hashFiles('Cargo.lock') }}complete
            cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.rustc }}-${{ steps.rust.outputs.epoch }}-${{ hashFiles('Cargo.lock') }}
            cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.rustc }}-${{ steps.rust.outputs.epoch }}-
      - name: Complete original unit, debug and fake-agent builds
        run: bash scripts/ci/cli.sh debug
      - name: Seal the tested debug executables and their provenance
        id: seal
        run: python3 scripts/ci/macos-debug-artifact.py seal --directory artifacts/mac-cli-debug
      - name: Publish only the fixed minimal debug handoff
        id: debug-upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-cli-debug-${{ needs.source.outputs.commit }}-a${{ github.run_attempt }}
          path: |
            artifacts/mac-cli-debug/hgs
            artifacts/mac-cli-debug/fake_agent
            artifacts/mac-cli-debug/manifest.json
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'schedule' && 3 || 7 }}
      # Save tested unit/debug fingerprints under a separate immutable key;
      # the core consumer saves its complete build without racing this writer.
      - name: Save Rust debug cache
        if: inputs.save_caches && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Retain test logs
        if: always() && (github.event_name != 'schedule' || failure())
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-debug-results-macOS-${{ runner.arch }}
          path: artifacts/test-results
          retention-days: ${{ github.event_name == 'schedule' && 3 || 7 }}

  cli-macos-core:
    name: macOS CLI integration and release
    needs: [source, cli-macos-debug]
    if: >-
      !cancelled() && needs.source.result == 'success' && needs.source.outputs.run_macos == 'true' && needs.cli-macos-debug.result == 'success'
    runs-on: macos-15
    timeout-minutes: 35
    env:
      CARGO_TERM_COLOR: always
      HOMEBREW_NO_AUTO_UPDATE: 1
      ZERUS_PYTHON_JOBS: 6
      SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
      MAC_DEBUG_ID: ${{ needs.cli-macos-debug.outputs.artifact_id }}
      MAC_DEBUG_SHA: ${{ needs.cli-macos-debug.outputs.manifest_sha256 }}
      MAC_DEBUG_ATTEMPT: ${{ needs.cli-macos-debug.outputs.producer_attempt }}
      MAC_DEBUG_RUST: ${{ needs.cli-macos-debug.outputs.rust_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - name: macOS test dependencies
        run: brew install tmux python
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Admit the completed producer identity before artifact lookup
        run: |
          python3 scripts/ci/macos-debug-artifact.py admit --artifact-id "$MAC_DEBUG_ID" \
            --manifest-sha256 "$MAC_DEBUG_SHA" --producer-attempt "$MAC_DEBUG_ATTEMPT" --rust-release "$MAC_DEBUG_RUST"
      - name: Download only this completed producer's immutable artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.cli-macos-debug.outputs.artifact_id }}
          path: ${{ runner.temp }}/mac-cli-debug
      - name: Select the producer's exact stable Rust release
        run: rustup toolchain install "$MAC_DEBUG_RUST" --profile minimal && rustup default "$MAC_DEBUG_RUST"
      - name: Rust cache identity
        id: rust
        run: |
          echo "rustc=$(rustc -Vv | git hash-object --stdin | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "epoch=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Restore Rust cache
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.rustc }}-${{ steps.rust.outputs.epoch }}-${{ hashFiles('Cargo.lock') }}complete
          restore-keys: |
            cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.rustc }}-${{ steps.rust.outputs.epoch }}-${{ hashFiles('Cargo.lock') }}debug
            cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.rustc }}-${{ steps.rust.outputs.epoch }}-${{ hashFiles('Cargo.lock') }}
            cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.rust.outputs.rustc }}-${{ steps.rust.outputs.epoch }}-
      - name: Verify and publish the exact debug executables
        run: |
          python3 scripts/ci/macos-debug-artifact.py install --directory "$RUNNER_TEMP/mac-cli-debug" \
            --artifact-id "$MAC_DEBUG_ID" --manifest-sha256 "$MAC_DEBUG_SHA" \
            --producer-attempt "$MAC_DEBUG_ATTEMPT" --rust-release "$MAC_DEBUG_RUST" --check-rust
      - name: Original smoke, Python integration and release build
        run: bash scripts/ci/cli.sh remaining
      - name: Save Rust cache
        if: inputs.save_caches && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Retain test logs
        if: always() && (github.event_name != 'schedule' || failure())
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-core-results-macOS-${{ runner.arch }}
          path: artifacts/test-results
          retention-days: ${{ github.event_name == 'schedule' && 3 || 7 }}

  cli-macos-native:
    name: macOS latest real-agent contracts
    needs: [source, cli-macos-debug]
    if: >-
      !cancelled() && needs.source.result == 'success' && needs.source.outputs.run_macos == 'true' && needs.cli-macos-debug.result == 'success'
    runs-on: macos-15
    timeout-minutes: 35
    cache-mode: none
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      SOURCE_COMMIT: ${{ needs.source.outputs.commit }}
      MAC_DEBUG_ID: ${{ needs.cli-macos-debug.outputs.artifact_id }}
      MAC_DEBUG_SHA: ${{ needs.cli-macos-debug.outputs.manifest_sha256 }}
      MAC_DEBUG_ATTEMPT: ${{ needs.cli-macos-debug.outputs.producer_attempt }}
      MAC_DEBUG_RUST: ${{ needs.cli-macos-debug.outputs.rust_release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - name: macOS test dependencies
        run: brew install tmux python
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Admit the completed producer identity before artifact lookup
        run: |
          python3 scripts/ci/macos-debug-artifact.py admit --artifact-id "$MAC_DEBUG_ID" \
            --manifest-sha256 "$MAC_DEBUG_SHA" --producer-attempt "$MAC_DEBUG_ATTEMPT" --rust-release "$MAC_DEBUG_RUST"
      - name: Download only this completed producer's immutable artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.cli-macos-debug.outputs.artifact_id }}
          path: ${{ runner.temp }}/mac-cli-debug
      - name: Verify and publish the exact debug executables
        run: |
          python3 scripts/ci/macos-debug-artifact.py install --directory "$RUNNER_TEMP/mac-cli-debug" \
            --artifact-id "$MAC_DEBUG_ID" --manifest-sha256 "$MAC_DEBUG_SHA" \
            --producer-attempt "$MAC_DEBUG_ATTEMPT" --rust-release "$MAC_DEBUG_RUST"
      - name: Keyless latest Codex, Claude Code and OpenCode compatibility
        run: python3 scripts/ci/agent-compatibility.py --hgs "$GITHUB_WORKSPACE/target/debug/hgs"
      - name: Retain test logs
        if: always() && (github.event_name != 'schedule' || failure())
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-native-results-macOS-${{ runner.arch }}
          path: artifacts/test-results
          retention-days: ${{ github.event_name == 'schedule' && 3 || 7 }}

  cli-macos:
    # Preserve the public historical full-suite admission name.
    name: CLI (macos-15)
    needs: [source, cli-macos-debug, cli-macos-core, cli-macos-native]
    if: always() && needs.source.outputs.run_macos == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    cache-mode: none
    env:
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          expected = {'source', 'cli-macos-debug', 'cli-macos-core', 'cli-macos-native'}
          if set(results) != expected or any(row['result'] != 'success' for row in results.values()):
              raise SystemExit('The selected macOS CLI producer, integration/release and native jobs must all succeed.')
          PY

  # Compiler caches use one entry per saving run and restore the newest by
  # prefix. A save follows a successful build that compiled something, keeping
  # only the entries this build used. Cache directories stay outside the
  # workspace, so they never reach packages, the portable zip or artifacts.
  arch:
    name: Arch desktop
    needs: source
    if: needs.source.outputs.run_arch == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: archlinux@sha256:996c3a1d6b0d87b01242f6fcd8cfa3ad3eece1a67ab5c8f108e20af1d7b97bdd
    env:
      CCACHE_DIR: /home/user/.cache/ccache
      CCACHE_MAXSIZE: 150M
      # Ninja starts a suite's own sources while the libraries it links still build.
      CMAKE_GENERATOR: Ninja
      ZERUS_BUILD_JOBS: 4
    steps:
      - name: Bootstrap Git before checkout
        run: pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - name: Arch dependencies and unprivileged builder
        run: |
          pacman -Syu --noconfirm --needed base-devel git cmake ninja qt6-base qt6-tools qt6-webengine qt6-multimedia qt6-svg kstatusnotifieritem kwindowsystem kidletime tmux openssh python ccache dbus
          useradd -m user
          chown -R user:user "$GITHUB_WORKSPACE"
      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/user/.cache/ccache
          key: arch-ccache-v1-${{ github.run_id }}
          restore-keys: arch-ccache-v1-
      - name: Reset ccache statistics
        id: ccache-start
        run: |
          chown -R user:user /home/user
          runuser -u user -- ccache -z
          echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Desktop build
        id: build
        run: runuser -u user -- bash scripts/ci/gui.sh build
      - name: ccache statistics
        id: ccache
        if: ${{ !cancelled() }}
        env:
          SAVE: ${{ inputs.save_caches && steps.build.outcome == 'success' }}
          STARTED: ${{ steps.ccache-start.outputs.started }}
        run: |
          runuser -u user -- ccache -sv
          misses=$(runuser -u user -- ccache --print-stats | awk -F'\t' '$1 == "cache_miss" { print $2 + 0 }')
          if [ "$SAVE" = true ] && [ "${misses:-0}" -gt 0 ]; then
            runuser -u user -- ccache --evict-older-than "$(( $(date +%s) - STARTED + 60 ))s"
            echo save=true >> "$GITHUB_OUTPUT"
          fi
      - name: Save ccache
        if: inputs.save_caches && steps.ccache.outputs.save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/user/.cache/ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}
      - name: Offscreen Qt suites
        run: runuser -u user -- env QTWEBENGINE_DISABLE_SANDBOX=1 bash scripts/ci/gui.sh test
      - name: Retain desktop test logs
        if: always() && (github.event_name != 'schedule' || failure())
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arch-desktop-results
          path: artifacts/test-results
          retention-days: ${{ github.event_name == 'schedule' && 3 || 7 }}

  arch-package:
    name: Arch package
    needs: source
    if: needs.source.outputs.run_arch == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: archlinux@sha256:996c3a1d6b0d87b01242f6fcd8cfa3ad3eece1a67ab5c8f108e20af1d7b97bdd
    env:
      ZERUS_DEV_BUILD_NUMBER: ${{ github.repository == 'ufna/zerus' && github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEV_UPDATES_ENABLED == 'true' && github.run_number || '' }}
      CCACHE_DIR: /home/user/.cache/ccache
      CCACHE_MAXSIZE: 100M
    steps:
      - name: Bootstrap Git before checkout
        run: pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
          fetch-depth: 0
      # The makepkg ccache drop-in exists only in this disposable container; the
      # published recipes are unchanged. Its compiler flags differ from the
      # desktop build, so it has a cache family of its own.
      - name: Arch packaging dependencies and unprivileged builder
        run: |
          pacman -Syu --noconfirm --needed base-devel git rust nodejs npm webkit2gtk-4.1 gtk3 alsa-lib gstreamer gst-plugins-base-libs libappindicator dbus gst-plugins-base gst-plugins-good gst-plugins-bad gst-plugins-ugly gst-libav tmux openssh python ccache namcap desktop-file-utils
          grep -qx 'BUILDENV=(!distcc color !ccache check !sign)' /etc/makepkg.conf ||
            { echo 'The default makepkg BUILDENV changed; review the ccache drop-in.' >&2; exit 1; }
          echo 'BUILDENV=(!distcc color ccache check !sign)' > /etc/makepkg.conf.d/ccache.conf
          useradd -m user
          chown -R user:user "$GITHUB_WORKSPACE"
      - name: Cache epoch
        id: epoch
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Restore Cargo registry
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /home/user/.cargo/registry
            /home/user/.cargo/git
          key: arch-cargo-v1-${{ steps.epoch.outputs.month }}-${{ hashFiles('Cargo.lock', 'services/mobile/connector/Cargo.lock', 'client/src-tauri/Cargo.lock', 'client/media/Cargo.lock', 'client/core/Cargo.lock') }}
          restore-keys: arch-cargo-v1-${{ steps.epoch.outputs.month }}-
      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/user/.cache/ccache
          key: arch-package-ccache-v1-${{ github.run_id }}
          restore-keys: arch-package-ccache-v1-
      - name: Reset ccache statistics
        id: ccache-start
        run: |
          chown -R user:user /home/user
          runuser -u user -- ccache -z
          echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Build and check package
        id: build
        run: runuser -u user -- bash scripts/build-arch-package.sh
      - name: ccache statistics
        id: ccache
        if: ${{ !cancelled() }}
        env:
          SAVE: ${{ inputs.save_caches && steps.build.outcome == 'success' }}
          STARTED: ${{ steps.ccache-start.outputs.started }}
        run: |
          runuser -u user -- ccache -sv
          misses=$(runuser -u user -- ccache --print-stats | awk -F'\t' '$1 == "cache_miss" { print $2 + 0 }')
          if [ "$SAVE" = true ] && [ "${misses:-0}" -gt 0 ]; then
            runuser -u user -- ccache --evict-older-than "$(( $(date +%s) - STARTED + 60 ))s"
            echo save=true >> "$GITHUB_OUTPUT"
          fi
      - name: Save ccache
        if: inputs.save_caches && steps.ccache.outputs.save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/user/.cache/ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}
      - name: Save Cargo registry
        if: inputs.save_caches && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /home/user/.cargo/registry
            /home/user/.cargo/git
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - name: Verify installed system bundle in disposable home
        shell: bash
        run: |
          set -euo pipefail
          pacman -U --noconfirm artifacts/*.pkg.tar.zst
          runuser -u user -- python3 scripts/check-installed-package.py 2>&1 | tee artifacts/test-results/installed-package.log
      # Dev, nightly and release assembly download this artifact from the same run.
      - name: Retain Arch package and test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arch-x86_64-${{ needs.source.outputs.commit }}
          path: artifacts
          retention-days: ${{ github.event_name == 'schedule' && 3 || 7 }}

  mac-desktop:
    name: macOS desktop
    needs: source
    if: needs.source.outputs.run_macos == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      CCACHE_MAXSIZE: 100M
      CMAKE_GENERATOR: Ninja
      HGS_SKIP_QT_SCALE_ROWS: 1
      ZERUS_BUILD_JOBS: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - run: brew install cmake ninja qt qtmultimedia ccache
      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/ccache
          key: mac-desktop-ccache-v1-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: mac-desktop-ccache-v1-${{ runner.arch }}-
      - name: Reset ccache statistics
        id: ccache-start
        run: |
          ccache -z
          echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Desktop build
        id: build
        run: bash scripts/ci/gui.sh build
      - name: ccache statistics
        id: ccache
        if: ${{ !cancelled() }}
        env:
          SAVE: ${{ inputs.save_caches && steps.build.outcome == 'success' }}
          STARTED: ${{ steps.ccache-start.outputs.started }}
        run: |
          ccache -sv
          misses=$(ccache --print-stats | awk -F'\t' '$1 == "cache_miss" { print $2 + 0 }')
          if [ "$SAVE" = true ] && [ "${misses:-0}" -gt 0 ]; then
            ccache --evict-older-than "$(( $(date +%s) - STARTED + 60 ))s"
            echo save=true >> "$GITHUB_OUTPUT"
          fi
      - name: Save ccache
        if: inputs.save_caches && steps.ccache.outputs.save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}
      - name: Offscreen Qt suites
        run: bash scripts/ci/gui.sh test
      - name: Retain desktop test logs
        if: always() && (github.event_name != 'schedule' || failure())
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-desktop-results
          path: artifacts/test-results
          retention-days: ${{ github.event_name == 'schedule' && 3 || 7 }}

  windows-desktop:
    name: Windows client, desktop and portable zip
    needs: source
    if: needs.source.outputs.run_windows == 'true'
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      WINDOWS_INSTALLER_VERSION: ${{ inputs.windows_installer_version }}
      CARGO_TERM_COLOR: always
      # Line tables keep test backtraces readable and bound the cached target size.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_INCREMENTAL: 0
      CARGO_BUILD_JOBS: 4
      ZERUS_BUILD_JOBS: 4
    steps:
      # Before checkout: the runner's Git converts text files to CRLF by default,
      # which changes fixtures, scripts and embedded text.
      - name: Check out text files unchanged
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      # One exact interpreter for every Python step; the runner image's default
      # changes with the image.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.15'
      - run: rustup toolchain install stable --profile minimal && rustup default stable && rustup toolchain install 1.99.1 --profile minimal --component clippy
      - name: Rust cache identity
        id: rust
        run: |
          echo "rustc=$(rustc -Vv | git hash-object --stdin | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "epoch=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Restore Rust cache
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cli-${{ runner.arch }}-${{ steps.rust.outputs.rustc }}-${{ steps.rust.outputs.epoch }}-${{ hashFiles('Cargo.lock', 'client/core/Cargo.lock', 'client/media/Cargo.lock', 'client/src-tauri/Cargo.lock') }}
          restore-keys: windows-cli-${{ runner.arch }}-${{ steps.rust.outputs.rustc }}-${{ steps.rust.outputs.epoch }}-
      # The runner gives every step a synchronous pipe as stdin. Windows OpenSSH
      # (and the fake client, which refuses it) must never inherit it, so steps
      # that start hgs, ssh or the desktop app read from /dev/null.
      - name: Rust client tests, Rust 1.99 lints and release build
        run: |
          mkdir -p artifacts/test-results
          cargo test --locked </dev/null 2>&1 | tee artifacts/test-results/rust.log
          # Pinned like the relay lints, so a new stable release cannot fail an
          # unchanged commit. Windows-only code is compiled nowhere else, so this
          # also checks it against Rust 1.99.
          cargo +1.99.1 clippy --locked --all-targets -- -D warnings 2>&1 | tee artifacts/test-results/clippy.log
          cargo build --release --locked
          cargo build --locked --example fake_ssh
          cargo build --locked --example fake_agent
      - name: Windows mobile connector build and native filesystem contracts
        run: |
          cargo +1.99.1 clippy --locked --manifest-path services/mobile/connector/Cargo.toml --target-dir target --all-targets -- -D warnings
          cargo +1.99.1 test --locked --manifest-path services/mobile/connector/Cargo.toml --target-dir target --lib windows_management::tests </dev/null \
            2>&1 | tee artifacts/test-results/windows-gateway-locks.log
          cargo +1.99.1 test --locked --manifest-path services/mobile/connector/Cargo.toml --target-dir target --test windows_gateway </dev/null \
            2>&1 | tee artifacts/test-results/windows-gateway-config.log
          cargo +1.99.1 test --locked --offline -j2 --manifest-path services/mobile/connector/Cargo.toml --target-dir target -p zerus-windows-private --lib -- --test-threads=2 </dev/null \
            2>&1 | tee artifacts/test-results/windows-gateway-launch-builder.log
          cargo +1.99.1 build --locked --release --manifest-path services/mobile/connector/Cargo.toml --target-dir target
      - name: Windows client integration tests
        run: |
          HGS_TEST_BIN=$(cygpath -w "$PWD/target/release/hgs.exe")
          HGS_TEST_FAKE_SSH=$(cygpath -w "$PWD/target/debug/examples/fake_ssh.exe")
          export HGS_TEST_BIN HGS_TEST_FAKE_SSH
          python -m unittest discover -s tests -p test_windows_client.py -v </dev/null 2>&1 | tee artifacts/test-results/windows-client.log
          python -m unittest discover -s tests -p test_repositories.py -v </dev/null 2>&1 | tee artifacts/test-results/windows-repositories.log
      # Microsoft's ConPTY pair (spec D6) from the NuGet package pinned in
      # packaging/windows/conpty.json: the package's SHA-256 is checked before it
      # is opened, then each of the two files'. Nothing from it runs here; the
      # host tests and the portable zip below use this folder.
      - name: Pinned ConPTY pair
        run: python scripts/fetch-conpty.py --output "$RUNNER_TEMP/conpty" </dev/null
      # Isolated session hosts of the release build (docs/windows-host-testing.md),
      # also from a copy next to the pinned ConPTY pair, and the terminal backend
      # contract against the host, its default here.
      # The runner puts every step in a job that forbids breakaway, where hgs
      # refuses to start a host (spec D4), so the suites run outside it, started
      # through WMI. Every wait in them has a deadline.
      - name: Windows session host tests
        timeout-minutes: 20
        run: |
          HGS_TEST_BIN=$(cygpath -w "$PWD/target/release/hgs.exe")
          HGS_TEST_FAKE_AGENT=$(cygpath -w "$PWD/target/debug/examples/fake_agent.exe")
          HGS_TEST_FAKE_SSH=$(cygpath -w "$PWD/target/debug/examples/fake_ssh.exe")
          HGS_TEST_CONPTY_DIR=$(cygpath -w "$RUNNER_TEMP/conpty")
          export HGS_TEST_BIN HGS_TEST_FAKE_AGENT HGS_TEST_FAKE_SSH HGS_TEST_CONPTY_DIR
          cd tests
          # Also hosts the suites start from temporary image copies (hgs-host-* folders).
          python ../scripts/ci/outside-job.py --timeout 900 --end "$HGS_TEST_BIN" --end '*\hgs-host-*\hgs.exe' \
            --log ../artifacts/test-results/windows-host.log -- \
            python -m unittest -v test_windows_host test_windows_host_conpty test_windows_host_survival \
            test_windows_lifecycle test_windows_hooks test_backend_contract </dev/null
      # A detached connector has fixture-owned handle custody. Keep this gate
      # outside the legacy host harness's PID/tree and wildcard image cleanup.
      - name: Windows mobile gateway isolated custody gate
        timeout-minutes: 20
        run: |
          HGS_TEST_BIN=$(cygpath -w "$PWD/target/release/hgs.exe")
          HGS_TEST_FAKE_AGENT=$(cygpath -w "$PWD/target/debug/examples/fake_agent.exe")
          HGS_TEST_CONPTY_DIR=$(cygpath -w "$RUNNER_TEMP/conpty")
          HGS_TEST_CONNECTOR=$(cygpath -w "$PWD/target/release/zerus-mobile-connector.exe")
          export HGS_TEST_BIN HGS_TEST_FAKE_AGENT HGS_TEST_CONPTY_DIR HGS_TEST_CONNECTOR
          python scripts/ci/outside-job.py --custody-only --timeout 900 \
            --log artifacts/test-results/windows-mobile-gateway.log -- \
            python -m unittest discover -s tests -p test_windows_mobile_gateway.py -v </dev/null
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install the locked Zerus Next frontend
        timeout-minutes: 5
        working-directory: client
        run: npm ci </dev/null
      - name: Build the Tauri Windows switch desktop
        timeout-minutes: 25
        working-directory: client
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target/windows-next
          CARGO_BUILD_JOBS: 4
        run: |
          npm run tauri -- build --ci --no-bundle --config src-tauri/tauri.windows.conf.json --features video </dev/null \
            2>&1 | tee ../artifacts/test-results/windows-next-build.log
          test -f ../target/windows-next/release/hgs-tray.exe
      - name: Save Rust cache
        if: inputs.save_caches && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Frontend runtime license notices
        run: python client/scripts/collect-notices.py artifacts/windows-frontend-licenses </dev/null
      # The app installer checks but never silently installs a shared runtime.
      # Only this disposable CI runner may use the verified bootstrapper.
      - name: WebView2 Evergreen prerequisite for Windows package tests
        timeout-minutes: 6
        run: python scripts/ci/ensure-webview2.py </dev/null
      - name: Portable zip from the tested executables
        run: |
          python scripts/package-windows.py --cli target/release/hgs.exe --gui target/windows-next/release/hgs-tray.exe \
            --connector target/release/zerus-mobile-connector.exe --frontend-licenses artifacts/windows-frontend-licenses \
            --conpty "$RUNNER_TEMP/conpty" --output artifacts/zerus-windows-x86_64.zip </dev/null 2>&1 | tee artifacts/test-results/package.log
          python scripts/check-windows-portable.py artifacts/zerus-windows-x86_64.zip --run --selftest \
            </dev/null 2>&1 | tee artifacts/test-results/portable.log
      # The per-user installer (packaging/windows/zerus.iss) from that zip, with
      # the runner image's Inno Setup 6: its payload is the zip's files byte for
      # byte. Assembly carries both unchanged and checks their CI build metadata.
      - name: Per-user installer from the portable zip
        run: |
          python scripts/package-windows-installer.py artifacts/zerus-windows-x86_64.zip \
            --version "${WINDOWS_INSTALLER_VERSION:-$(cat VERSION)}" \
            --info artifacts/installer/windows-installer-info.json \
            --output artifacts/installer/zerus-windows-x86_64-setup.exe </dev/null 2>&1 | tee artifacts/test-results/installer-package.log
      # Install, upgrade over it and uninstall while a session host of the
      # installed build runs from its staged image, outside the step's job as the
      # host suites run.
      - name: Installer upgrade keeps the session host
        timeout-minutes: 15
        run: |
          HGS_TEST_BIN=$(cygpath -w "$PWD/target/release/hgs.exe")
          HGS_TEST_INSTALLER=$(cygpath -w "$PWD/artifacts/installer/zerus-windows-x86_64-setup.exe")
          HGS_TEST_PORTABLE_ZIP=$(cygpath -w "$PWD/artifacts/zerus-windows-x86_64.zip")
          HGS_TEST_INSTALLER_VERSION="${WINDOWS_INSTALLER_VERSION:-$(cat VERSION)}"
          export HGS_TEST_BIN HGS_TEST_INSTALLER HGS_TEST_PORTABLE_ZIP HGS_TEST_INSTALLER_VERSION
          cd tests
          python ../scripts/ci/outside-job.py --timeout 600 --end "$HGS_TEST_BIN" --end '*\hgs-host-*\hgs.exe' \
            --log ../artifacts/test-results/installer.log -- \
            python -m unittest -v test_windows_installer_survival </dev/null
      # Stable and nightly assembly download this artifact from the same run.
      - name: Retain Windows portable zip and test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-x86_64-${{ needs.source.outputs.commit }}
          path: artifacts
          retention-days: ${{ github.event_name == 'schedule' && 3 || 7 }}
          compression-level: 0

  # The latest win32-x64 Claude Code and Codex packages selected by
  # scripts/ci/agent-compatibility.py through isolated session hosts of the
  # release build, each agent against a local fake API. A job of its own, so a
  # failure points at the host and windows-desktop keeps its time margin.
  windows-host:
    name: Windows real agents through the session host
    needs: source
    if: needs.source.outputs.run_windows == 'true'
    runs-on: windows-2025
    timeout-minutes: 80
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - name: Check out text files unchanged
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.15'
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Rust cache identity
        id: rust
        run: |
          echo "rustc=$(rustc -Vv | git hash-object --stdin | cut -c1-16)" >> "$GITHUB_OUTPUT"
          echo "epoch=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      # The windows-desktop family, which only that job saves: this job restores
      # it and never saves, so the two jobs cannot race for one key.
      - name: Restore Rust cache
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cli-${{ runner.arch }}-${{ steps.rust.outputs.rustc }}-${{ steps.rust.outputs.epoch }}-${{ hashFiles('Cargo.lock', 'client/core/Cargo.lock', 'client/media/Cargo.lock', 'client/src-tauri/Cargo.lock') }}
          restore-keys: windows-cli-${{ runner.arch }}-${{ steps.rust.outputs.rustc }}-${{ steps.rust.outputs.epoch }}-
      - run: cargo build --release --locked
      - name: Pinned ConPTY pair
        run: python scripts/fetch-conpty.py --output "$RUNNER_TEMP/conpty" </dev/null
      # The runner downloads and verifies each win32-x64 pin, extracts only its
      # executable into a zerus-native-compat-* folder and runs that agent's class
      # of tests/test_windows_native_agents.py; a skipped or empty suite fails.
      # The suites start session hosts, so like the host suites of windows-desktop
      # they run outside the step's job, and their leftovers end by executable
      # path: hosts of the release build, the copies and staged images in the
      # hgs-host-* folders of the suites, and the extracted agents. UTF-8 mode keeps
      # non-ASCII prompts in the logs from failing on a Windows code page.
      - name: Real Claude Code and Codex through the session host
        timeout-minutes: 50
        env:
          PYTHONUTF8: 1
        run: |
          mkdir -p artifacts/test-results
          HGS_TEST_BIN=$(cygpath -w "$PWD/target/release/hgs.exe")
          HGS_TEST_CONPTY_DIR=$(cygpath -w "$RUNNER_TEMP/conpty")
          export HGS_TEST_BIN HGS_TEST_CONPTY_DIR
          python scripts/ci/outside-job.py --timeout 2700 --end "$HGS_TEST_BIN" --end '*\hgs-host-*\*.exe' \
            --end '*\zerus-native-compat-*\*.exe' --log artifacts/test-results/windows-real-agents.log -- \
            python scripts/ci/agent-compatibility.py </dev/null
      - name: Retain test logs
        if: always() && (github.event_name != 'schedule' || failure())
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-host-results
          path: artifacts/test-results
          retention-days: ${{ github.event_name == 'schedule' && 3 || 7 }}

  gate:
    name: Suite results
    if: always() && (github.event.repository.private == false || github.event_name == 'workflow_dispatch')
    needs: [source, quick, client-frontend, relay, connector, connector-macos, ios, android, client-native-linux, client-native-macos-core, client-native-macos-tauri, client-native-windows, cli, cli-macos-debug, cli-macos-core, cli-macos-native, cli-macos, arch, arch-package, mac-desktop, windows-desktop, windows-host]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RESULTS: ${{ toJSON(needs) }}
      RUN_LINUX: ${{ needs.source.outputs.run_linux == 'true' }}
      RUN_ARCH: ${{ needs.source.outputs.run_arch == 'true' }}
      RUN_MACOS: ${{ needs.source.outputs.run_macos == 'true' }}
      RUN_WINDOWS: ${{ needs.source.outputs.run_windows == 'true' }}
      RUN_IOS: ${{ needs.source.outputs.run_ios == 'true' }}
    steps:
      - run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          selected = {
              'source': True,
              'quick': True,
              'client-frontend': True,
              'relay': True,
              'connector': True,
              'android': True,
              'client-native-linux': json.loads(os.environ['RUN_LINUX']),
              'client-native-macos-core': json.loads(os.environ['RUN_MACOS']),
              'client-native-macos-tauri': json.loads(os.environ['RUN_MACOS']),
              'client-native-windows': json.loads(os.environ['RUN_WINDOWS']),
              'cli': json.loads(os.environ['RUN_LINUX']),
              'cli-macos-debug': json.loads(os.environ['RUN_MACOS']),
              'cli-macos-core': json.loads(os.environ['RUN_MACOS']),
              'cli-macos-native': json.loads(os.environ['RUN_MACOS']),
              'cli-macos': json.loads(os.environ['RUN_MACOS']),
              'arch': json.loads(os.environ['RUN_ARCH']),
              'arch-package': json.loads(os.environ['RUN_ARCH']),
              'mac-desktop': json.loads(os.environ['RUN_MACOS']),
              'connector-macos': json.loads(os.environ['RUN_MACOS']),
              'ios': json.loads(os.environ['RUN_IOS']),
              'windows-desktop': json.loads(os.environ['RUN_WINDOWS']),
              'windows-host': json.loads(os.environ['RUN_WINDOWS']),
          }
          for name, enabled in selected.items():
              expected = 'success' if enabled else 'skipped'
              actual = results[name]['result']
              if actual != expected:
                  raise SystemExit(f"{name}: {actual}, expected {expected}")
          print('All selected CI suites passed; unselected suites were skipped.')
          PY
