name: Fork Windows build

# WhiteWh/zerus only; not part of upstream Zerus. Builds and
# refreshes the single prerelease `latest` on branch pushes. Numbered releases
# are created only through manual dispatch. Latest has no automatic update feed;
# manual WhiteWh releases retain their existing feed (docs/fork-updates.md).
# A pushed tag whitewh-exp-* builds that commit the same
# way and publishes an experimental prerelease: never the latest release, no
# feed, and no updater in its desktop app.
on:
  push:
    branches: [whitewh/main]
    tags: ['whitewh-exp-*']
  workflow_dispatch:
    inputs:
      channel:
        description: Numbered release or refresh the rolling Latest prerelease
        type: choice
        options: [numbered, latest]
        default: numbered

permissions:
  contents: read

concurrency:
  group: fork-windows
  # GitHub's default is queue: single; actionlint 1.7.12 cannot parse that key.
  # Keep the running build and replace only the pending run on newer pushes.
  cancel-in-progress: false

jobs:
  windows:
    name: Windows portable zip and release
    if: >-
      github.repository == 'WhiteWh/zerus' &&
      (github.ref == 'refs/heads/whitewh/main' || startsWith(github.ref, 'refs/tags/whitewh-exp-'))
    runs-on: windows-2025
    timeout-minutes: 150
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      ZERUS_BUILD_JOBS: 4
      CCACHE_DEPEND: 1
      CCACHE_MAXSIZE: 500M
      EXPERIMENTAL: ${{ startsWith(github.ref, 'refs/tags/whitewh-exp-') }}
      LATEST_BUILD: ${{ github.ref == 'refs/heads/whitewh/main' && (github.event_name == 'push' || inputs.channel == 'latest') }}
      # Embedded in hgs-tray: the build the updater compares and the feed it reads.
      # Empty for an experimental build, so it neither updates nor gets updated.
      ZERUS_FORK_BUILD: ${{ !startsWith(github.ref, 'refs/tags/whitewh-exp-') && github.run_number || '' }}
      # Only a manually requested numbered WhiteWh release uses the stable feed.
      ZERUS_FORK_FEED_URL: ${{ github.repository == 'WhiteWh/zerus' && github.event_name == 'workflow_dispatch' && inputs.channel != 'latest' && !startsWith(github.ref, 'refs/tags/whitewh-exp-') && 'https://github.com/WhiteWh/zerus/releases/latest/download/zerus-fork-feed.json' || '' }}
    steps:
      - name: Check out text files unchanged
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Latest resolves the current branch only after getting its slot.
          # Manual numbered releases and experimental tags keep their event SHA.
          ref: ${{ !startsWith(github.ref, 'refs/tags/whitewh-exp-') && (github.event_name == 'push' || inputs.channel == 'latest') && 'refs/heads/whitewh/main' || github.sha }}
          persist-credentials: false
      - name: Record the checked-out source
        id: source
        run: |
          commit=$(git rev-parse HEAD)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "Source commit: $commit (trigger: $GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.15'
      - name: Latest publication contract tests
        run: python -m unittest discover -s tests -p test_fork_latest_publication.py
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Rust cache identity
        id: rust
        run: echo "rustc=$(rustc -Vv | git hash-object --stdin | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Restore Rust cache
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            services/mobile/connector/target
            services/mobile/relay/target
          key: fork-windows-cli-${{ steps.rust.outputs.rustc }}-${{ hashFiles('Cargo.lock', 'services/mobile/connector/Cargo.lock', 'services/mobile/relay/Cargo.lock') }}
          restore-keys: fork-windows-cli-${{ steps.rust.outputs.rustc }}-
      # The runner gives every step a synchronous pipe as stdin; hgs must not inherit it.
      - name: Rust tests and release build
        run: |
          mkdir -p artifacts/test-results
          cargo test --locked --features socraticode </dev/null 2>&1 | tee artifacts/test-results/rust.log
          cargo build --release --locked --features socraticode
          # WhiteWh fork: the mobile gateway's connector and relay (docs/fork-updates.md).
          cargo test --locked --lib --manifest-path services/mobile/connector/Cargo.toml </dev/null 2>&1 | tee artifacts/test-results/connector.log
          cargo build --release --locked --manifest-path services/mobile/connector/Cargo.toml
          cargo build --release --locked --manifest-path services/mobile/relay/Cargo.toml
      - name: Save Rust cache
        if: steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            services/mobile/connector/target
            services/mobile/relay/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Pinned ConPTY pair
        run: python scripts/fetch-conpty.py --output "$RUNNER_TEMP/conpty" </dev/null
      - name: Restore Qt 6.10.3 for MSVC
        id: qt-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/Qt
          key: fork-windows-qt-6.10.3-win64_msvc2022_64-${{ hashFiles('packaging/windows/qt.json', 'scripts/install-qt-windows.py', 'scripts/qt_archives.py') }}
      - name: Install the pinned Qt 6.10.3 for MSVC
        if: steps.qt-cache.outputs.cache-hit != 'true'
        run: python scripts/install-qt-windows.py --output "$RUNNER_TEMP/Qt" </dev/null
      - name: Use Qt 6.10.3
        run: |
          python scripts/install-qt-windows.py --check "$RUNNER_TEMP/Qt" </dev/null
          qt=$(cygpath -w "$RUNNER_TEMP/Qt/6.10.3/msvc2022_64")
          test -f "$(cygpath -u "$qt")/bin/windeployqt.exe"
          echo "QT_ROOT_DIR=$qt" >> "$GITHUB_ENV"
      - name: Pinned ccache 4.14.1
        run: |
          cd "$(cygpath -u "$RUNNER_TEMP")"
          curl -fsSLO https://github.com/ccache/ccache/releases/download/v4.14.1/ccache-4.14.1-windows-x86_64.zip
          echo '6219f3865ca59aec41ee4b678df171d5d35855ecb2b6dbbbd20690b3a68af7b4  ccache-4.14.1-windows-x86_64.zip' | sha256sum --check --strict
          python -m zipfile -e ccache-4.14.1-windows-x86_64.zip .
          cygpath -w "$PWD/ccache-4.14.1-windows-x86_64" >> "$GITHUB_PATH"
          echo "CCACHE_DIR=$(cygpath -w "$RUNNER_TEMP/ccache")" >> "$GITHUB_ENV"
      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: fork-windows-ccache-qt6.10.3-${{ github.run_id }}
          restore-keys: fork-windows-ccache-qt6.10.3-
      - name: Desktop build
        run: bash scripts/ci/gui.sh build </dev/null
      - name: Save ccache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}
      - name: Save Qt 6.10.3
        if: steps.qt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/Qt
          key: ${{ steps.qt-cache.outputs.cache-primary-key }}
      - name: Offscreen Qt suites
        # .zerus/tests.toml [retries] flaky = 1: a failed suite runs once more;
        # the log names every suite that needed it.
        env:
          ZERUS_QT_RETRY: "2"
          # The Rust step built this CLI; do not depend on a debug build or Qt layout.
          ZERUS_TEST_HGS: ${{ github.workspace }}/target/release/hgs.exe
        run: |
          test -f "$(cygpath -u "$ZERUS_TEST_HGS")"
          bash scripts/ci/gui.sh test </dev/null
      - name: Portable zip from the tested executables
        run: |
          python scripts/package-windows.py --cli target/release/hgs.exe --gui .ci-build/gui/hgs-tray.exe \
            --connector services/mobile/connector/target/release/zerus-mobile-connector.exe \
            --mobile-relay services/mobile/relay/target/release/zerus-relay.exe \
            --conpty "$RUNNER_TEMP/conpty" --output artifacts/zerus-windows-x86_64.zip </dev/null 2>&1 | tee artifacts/test-results/package.log
          python scripts/check-windows-portable.py artifacts/zerus-windows-x86_64.zip --run --selftest \
            </dev/null 2>&1 | tee artifacts/test-results/portable.log
      - name: Refresh rolling Latest prerelease
        if: env.LATEST_BUILD == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          python scripts/publish-fork-latest.py --repository "$GITHUB_REPOSITORY" \
            --commit "$COMMIT" --run-id "$GITHUB_RUN_ID" \
            --zip artifacts/zerus-windows-x86_64.zip
      # Schema 1 of docs/fork-updates.md: the updater installs `url` only when its
      # size and SHA-256 match and the zip's build-info.json names `commit`.
      - name: Update feed
        if: github.repository == 'WhiteWh/zerus' && env.EXPERIMENTAL != 'true' && env.LATEST_BUILD != 'true'
        env:
          BUILD: ${{ github.run_number }}
          COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          python - <<'EOF'
          import hashlib, json, os, pathlib
          zip = pathlib.Path("artifacts/zerus-windows-x86_64.zip")
          build = int(os.environ["BUILD"])
          feed = {"schema": 1, "build": build, "commit": os.environ["COMMIT"],
                  "url": f"https://github.com/WhiteWh/zerus/releases/download/whitewh-{build}/{zip.name}",
                  "size": zip.stat().st_size, "sha256": hashlib.sha256(zip.read_bytes()).hexdigest()}
          pathlib.Path("artifacts/zerus-fork-feed.json").write_text(json.dumps(feed, indent=2) + "\n")
          print(json.dumps(feed, indent=2))
          EOF
      - name: Publish the fork release
        if: env.EXPERIMENTAL != 'true' && env.LATEST_BUILD != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ github.run_number }}
          COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          gh release create "whitewh-$BUILD" artifacts/zerus-windows-x86_64.zip artifacts/zerus-fork-feed.json \
            --repo "$GITHUB_REPOSITORY" --target "$COMMIT" --latest \
            --title "Zerus fork build $BUILD" \
            --notes "Windows portable build $BUILD of whitewh/main at $COMMIT. Installed automatically by fork builds of Zerus (docs/fork-updates.md)."
      - name: Publish the experimental prerelease
        if: env.EXPERIMENTAL == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          gh release create "$TAG" artifacts/zerus-windows-x86_64.zip             --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --latest=false             --title "Zerus fork experimental $TAG"             --notes "Experimental Windows portable build of $COMMIT (tag $TAG). Not the latest release and not offered by the fork updater; this build does not update itself. Install it by hand (docs/fork-updates.md)."
      - name: Retain test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fork-windows-${{ github.run_number }}
          path: artifacts/test-results
          retention-days: 7
