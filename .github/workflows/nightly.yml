name: Nightly
run-name: Nightly main (${{ github.run_number }})

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-build
  cancel-in-progress: false

jobs:
  version:
    if: github.repository == 'ufna/zerus' && github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    cache-mode: none
    outputs:
      installer: ${{ steps.version.outputs.installer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: version
        env:
          NIGHTLY_RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess, sys
          sys.path.insert(0, 'scripts')
          from nightly_common import nightly_version
          product = pathlib.Path('VERSION').read_text().strip()
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          count = int(subprocess.check_output(['git', 'rev-list', '--count', 'HEAD'], text=True))
          version = nightly_version(product, count, commit, int(os.environ['NIGHTLY_RUN_NUMBER']))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('installer=' + version + '\n')
          PY
  verify:
    needs: version
    if: github.event_name == 'schedule' && github.repository == 'ufna/zerus' && github.ref == 'refs/heads/main' && github.event.repository.private == false
    cache-mode: write
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ github.sha }}
      run_linux: true
      run_arch: true
      run_macos: true
      run_windows: true
      windows_installer_version: ${{ needs.version.outputs.installer }}
      run_ios: true
      save_caches: true
  review:
    needs: version
    if: github.event_name == 'workflow_dispatch' && github.repository == 'ufna/zerus' && github.ref == 'refs/heads/main' && github.event.repository.private == false
    cache-mode: read
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ github.sha }}
      run_linux: true
      run_arch: true
      run_macos: true
      run_windows: true
      windows_installer_version: ${{ needs.version.outputs.installer }}
      run_ios: true
  gate:
    name: Nightly verification gate
    needs: [verify, review]
    if: always() && github.repository == 'ufna/zerus' && github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    cache-mode: none
    env:
      RESULTS: ${{ toJSON(needs) }}
    steps:
      - run: |
          python3 - <<'PY'
          import json, os
          results = sorted(row['result'] for row in json.loads(os.environ['RESULTS']).values())
          assert results == ['skipped', 'success'], 'Exactly one full Nightly matrix must succeed.'
          PY
  ios:
    permissions:
      contents: read
      actions: read
    name: iOS TestFlight Dev build
    # Independent of the zerus.dev Dev catalog: TestFlight delivers it to internal testers;
    # a maintainer promotes chosen builds to the public beta through Beta App Review.
    needs: gate
    if: >-
      !cancelled() && needs.gate.result == 'success' &&
      github.repository == 'ufna/zerus' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.event.repository.private == false && vars.IOS_TESTFLIGHT_ENABLED == 'true'
    uses: ./.github/workflows/ios-testflight.yml
    with:
      channel: dev
    secrets:
      APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      IOS_DEVELOPMENT_P12: ${{ secrets.IOS_DEVELOPMENT_P12 }}
      IOS_DEVELOPMENT_P12_PASSWORD: ${{ secrets.IOS_DEVELOPMENT_P12_PASSWORD }}
  macos:
    # The zerus@nightly cask starts once the macos-signing environment is
    # provisioned; see docs/macos-distribution.md. A failed cask fails the nightly.
    if: >-
      !cancelled() && needs.gate.result == 'success' && vars.MACOS_CASKS_ENABLED == 'true'
    needs: gate
    uses: ./.github/workflows/macos-cask.yml
    with:
      channel: nightly
    secrets:
      MACOS_DEVELOPER_ID_P12: ${{ secrets.MACOS_DEVELOPER_ID_P12 }}
      MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
      APPLE_NOTARY_API_KEY_P8: ${{ secrets.APPLE_NOTARY_API_KEY_P8 }}
      APPLE_NOTARY_API_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
      APPLE_NOTARY_API_ISSUER_ID: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
  assemble:
    needs: [gate, macos]
    # A skipped cask is acceptable only while macOS casks are disabled.
    if: >-
      !cancelled() && needs.gate.result == 'success' &&
      (needs.macos.result == 'success' || (needs.macos.result == 'skipped' && vars.MACOS_CASKS_ENABLED != 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: archlinux@sha256:996c3a1d6b0d87b01242f6fcd8cfa3ad3eece1a67ab5c8f108e20af1d7b97bdd
    steps:
      - name: Bootstrap Git before checkout
        run: pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: arch-x86_64-${{ github.sha }}
          path: artifacts/arch
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-x86_64-${{ github.sha }}
          path: artifacts/windows
      - if: needs.macos.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-signed-${{ github.sha }}
          path: artifacts/macos-signed
      - name: Arch packaging dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git python webkit2gtk-4.1 gtk3 alsa-lib gstreamer gst-plugins-base-libs libappindicator dbus gst-plugins-base gst-plugins-good gst-plugins-bad gst-plugins-ugly gst-libav tmux openssh curl procps-ng hicolor-icon-theme namcap desktop-file-utils
          useradd -m user
          chown -R user:user "$GITHUB_WORKSPACE"
      - name: Assemble and check exact verified nightly
        env:
          NIGHTLY_RUN_ID: ${{ github.run_id }}
          NIGHTLY_RUN_NUMBER: ${{ github.run_number }}
          MACOS_CASK: ${{ needs.macos.result == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          packages=(artifacts/arch/*.pkg.tar.zst)
          portables=(artifacts/windows/*.zip)
          test "${#packages[@]}" = 1
          test "${#portables[@]}" = 1
          macos=()
          if [ "$MACOS_CASK" = true ]; then macos=(--macos artifacts/macos-signed); fi
          runuser -u user -- python3 scripts/prepare-nightly.py --package "${packages[0]}" \
            --windows-zip "${portables[0]}" \
            --windows-installer artifacts/windows/installer/zerus-windows-x86_64-setup.exe \
            --windows-installer-info artifacts/windows/installer/windows-installer-info.json \
            --run-id "$NIGHTLY_RUN_ID" --run-number "$NIGHTLY_RUN_NUMBER" --output dist "${macos[@]}"
          runuser -u user -- bash scripts/check-nightly-package.sh dist
          pacman -U --noconfirm dist/*.pkg.tar.zst
          runuser -u user -- python3 scripts/check-installed-package.py
      - name: Retain nightly packaging logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-packaging-${{ github.run_id }}
          path: artifacts/test-results
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zerus-nightly-${{ github.run_id }}-candidate
          path: dist
          retention-days: 3
          include-hidden-files: true
