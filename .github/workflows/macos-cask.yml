name: macOS cask

# Builds, signs, notarizes and installs the Apple Silicon bundle of one Homebrew
# channel for an already verified main revision. Only release.yml, nightly.yml and trusted main CI
# call it and explicitly forward the five Apple secret names. The signing job
# alone reads their values from macos-signing, whose policy admits only main.
on:
  workflow_call:
    inputs:
      channel:
        description: Homebrew channel of the candidate, stable, nightly or dev
        type: string
        required: true
      reuse_unsigned:
        description: Reuse this run's parallel, credential-free Dev bundle after its CI gate
        type: boolean
        default: false
      unsigned_release:
        type: string
        default: ''
    secrets:
      MACOS_DEVELOPER_ID_P12:
        required: true
      MACOS_DEVELOPER_ID_P12_PASSWORD:
        required: true
      APPLE_NOTARY_API_KEY_P8:
        required: true
      APPLE_NOTARY_API_KEY_ID:
        required: true
      APPLE_NOTARY_API_ISSUER_ID:
        required: false

permissions:
  contents: read

cache-mode: none

jobs:
  bundle:
    if: ${{ !inputs.reuse_unsigned }}
    uses: ./.github/workflows/macos-bundle.yml
    with:
      channel: ${{ inputs.channel }}
  sign:
    name: macOS signing and notarization
    needs: bundle
    if: >-
      !cancelled() && ((inputs.reuse_unsigned && needs.bundle.result == 'skipped') ||
      (!inputs.reuse_unsigned && needs.bundle.result == 'success'))
    runs-on: macos-15
    # Separate accepted submissions for the app and its final, signed disk image.
    timeout-minutes: 270
    environment: macos-signing
    steps:
      - name: Require upstream main
        env:
          WORKFLOW_REF: ${{ github.ref }}
          WORKFLOW_REPOSITORY: ${{ github.repository }}
        run: |
          test "$WORKFLOW_REF" = refs/heads/main
          test "$WORKFLOW_REPOSITORY" = ufna/zerus
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bind the parallel candidate to this exact Dev run
        if: inputs.reuse_unsigned
        env:
          CHANNEL: ${{ inputs.channel }}
          RELEASE: ${{ inputs.unsigned_release }}
          RUN_NUMBER: ${{ github.run_number }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os, pathlib
          assert os.environ['CHANNEL'] == 'dev' and os.environ['EVENT_NAME'] == 'push'
          expected = pathlib.Path('DEV_VERSION').read_text().strip() + '-dev.' + os.environ['RUN_NUMBER']
          assert os.environ['RELEASE'] == expected, 'Unsigned candidate version differs from this Dev run.'
          PY
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-unsigned-${{ github.sha }}
          path: artifacts/macos-unsigned
      - name: Prepare a temporary signing keychain
        env:
          P12: ${{ secrets.MACOS_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_API_KEY_P8 }}
          TEAM_ID: ${{ vars.MACOS_TEAM_ID }}
        run: bash scripts/ci/macos-keychain.sh create
      - name: Sign, notarize, staple and check
        env:
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          # Empty for an individual API key.
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}
          TEAM_ID: ${{ vars.MACOS_TEAM_ID }}
          RELEASE: ${{ inputs.reuse_unsigned && inputs.unsigned_release || needs.bundle.outputs.release }}
        shell: bash
        run: |
          set -euo pipefail
          signing="$RUNNER_TEMP/zerus-signing"
          version="$(cat VERSION)"
          issuer=()
          if [ -n "$NOTARY_ISSUER" ]; then issuer=(--notary-issuer "$NOTARY_ISSUER"); fi
          ditto -x -k artifacts/macos-unsigned/Zerus-unsigned.zip "$RUNNER_TEMP/unsigned"
          python3 scripts/sign-macos.py --app "$RUNNER_TEMP/unsigned/Zerus.app" \
            --identity "$(cat "$signing/identity")" --team-id "$TEAM_ID" --keychain "$signing/signing.keychain-db" \
            --version "$version" --release "$RELEASE" --output artifacts/macos-signed \
            --notary-key-file "$signing/notary.p8" --notary-key-id "$NOTARY_KEY_ID" "${issuer[@]}"
          ditto -x -k "artifacts/macos-signed/zerus-$RELEASE-macos-arm64.zip" "$RUNNER_TEMP/signed"
          python3 scripts/check-macos-bundle.py "$RUNNER_TEMP/signed/Zerus.app" --gui tauri --version "$version" \
            --release "$RELEASE" --team-id "$TEAM_ID"
      - name: Remove signing material
        if: always()
        run: bash scripts/ci/macos-keychain.sh delete
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-signed-${{ github.sha }}
          path: artifacts/macos-signed
          retention-days: 3
  verify:
    name: macOS cask installation
    needs: sign
    if: ${{ !cancelled() && needs.sign.result == 'success' }}
    runs-on: macos-15
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-signed-${{ github.sha }}
          path: artifacts/macos-signed
      - run: brew install tmux
      - name: Install the candidate cask from a local tap
        env:
          CHANNEL: ${{ inputs.channel }}
          # Nightly prereleases are tagged with the calling workflow run.
          TAG: ${{ inputs.channel == 'nightly' && format('nightly-{0}', github.run_id) || inputs.channel == 'dev' && format('dev-desktop-{0}', github.run_id) || '' }}
        run: bash scripts/ci/macos-cask-install.sh artifacts/macos-signed "$CHANNEL" "$TAG"
