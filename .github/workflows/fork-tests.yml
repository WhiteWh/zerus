name: Fork tests

# WhiteWh/zerus only; not part of upstream Zerus. Owner, 2026-11-11: every
# push to `whitewh/main` runs the Windows tests, and nothing else. It builds no
# package, publishes nothing and writes no cache or release: "builds only on a
# pin" (fork-windows.yml, owner 2026-11-09) stays as it is.
# Why: the fork's branch had no check of its own (ci.yml runs for `main`), so a
# build dispatch was the first time a commit met the runner. Of thirty builds
# seventeen failed, each on the next test that reads the runner differently
# from the developer's machine, and each cost a whole build. This run names
# those failures at the push that made them.
# Owner, 2026-11-13: a pull request into `whitewh/main` runs the same tests, so
# a contributor's change meets the runner before it is merged. It is the
# `pull_request` event: a fork's run gets a read-only token, no secrets, and
# GitHub asks a maintainer to approve an outside contributor's run.
on:
  push:
    branches: [whitewh/main]
    paths-ignore:
      - 'docs/**'
      - 'design/**'
  pull_request:
    branches: [whitewh/main]
    paths-ignore:
      - 'docs/**'
      - 'design/**'
  workflow_dispatch:

permissions:
  contents: read

# One line per pull request and one for the branch: a pull request never
# cancels the branch's run. Only the newest push matters: an older run still
# going is replaced; a manual run is never cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('fork-tests-pr-{0}', github.event.pull_request.number) || format('fork-tests-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  windows:
    name: Windows tests
    if: github.repository == 'WhiteWh/zerus'
    runs-on: windows-2025
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
    steps:
      - name: Check out text files unchanged
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.15'
      - name: Fork workflow contract tests
        run: |
          python -m unittest discover -s tests -p test_fork_latest_publication.py
          python -m unittest discover -s tests -p test_cargo_test_retry.py
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Rust cache identity
        id: rust
        run: echo "rustc=$(rustc -Vv | git hash-object --stdin | cut -c1-16)" >> "$GITHUB_OUTPUT"
      # Read only: the build's own cache is reused when it fits, and this run
      # never saves one.
      - name: Restore the build's Rust cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            services/mobile/connector/target
            services/mobile/relay/target
          key: fork-windows-cli-${{ steps.rust.outputs.rustc }}-${{ hashFiles('Cargo.lock', 'crates/lore-bin/Cargo.lock', 'services/mobile/connector/Cargo.lock', 'services/mobile/relay/Cargo.lock') }}
          restore-keys: fork-windows-cli-${{ steps.rust.outputs.rustc }}-
      # The same command the build runs, with the same single retry of a test
      # that failed (scripts/ci/cargo-test-retry.py).
      - name: Rust tests
        run: |
          python scripts/ci/cargo-test-retry.py --log artifacts/test-results/rust.log -- cargo test --locked --features socraticode
          python scripts/ci/cargo-test-retry.py --log artifacts/test-results/connector.log -- cargo test --locked --lib --manifest-path services/mobile/connector/Cargo.toml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: always()
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Desktop client tests and types
        if: always()
        working-directory: client
        run: |
          npm ci --no-audit --no-fund </dev/null
          npx vitest run </dev/null 2>&1 | tee ../artifacts/test-results/vitest.log
          npx tsc --noEmit </dev/null
      - name: Retain test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fork-tests-${{ github.run_number }}
          path: artifacts/test-results
          retention-days: 7
